name: AdaApps Sentinel 7/24 Sentetik İzleme

on:
  schedule:
    # Her saat başı çalışır (Günde 24 kez, ayda ~720 kez, GitHub ücretsiz kotası dahilindedir)
    - cron: '0 * * * *'
  workflow_dispatch: # GitHub arayüzünden tek tıkla elle tetikleme imkanı

jobs:
  health-check:
    name: Otonom QA ve Sağlık Denetimi
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js Ortamını Kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sentinel Denetimini Başlat
        env:
          GEMINI_API_KEY: ${{ secrets.AQ.Ab8RN6IC5kY0KlEtTQ5dh3D0w_NpKSFV8DunGGYh0DwfUddMIg }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.8660378466:AAFpcF54ocSfjT36NSzGUBfM-lcE8nIeJB0 }}
          TELEGRAM_CHAT_ID: ${{ secrets.946496294 }}
        run: node scripts/sentinel-monitor.js
